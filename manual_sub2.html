<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>時間計算ツール</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
}

body{

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    radial-gradient(circle at top left,#9ed8ff 0%,transparent 35%),
    radial-gradient(circle at bottom right,#dff8ff 0%,transparent 40%),
    linear-gradient(135deg,#f9fcff,#edf8ff);

    overflow:hidden;
}

/* 背景の光 */

body::before{

    content:"";

    position:absolute;

    width:600px;
    height:600px;

    background:#9fdcff;

    filter:blur(160px);

    opacity:.25;

    animation:float 8s ease-in-out infinite;

}

@keyframes float{

0%{transform:translate(-120px,-80px);}
50%{transform:translate(120px,80px);}
100%{transform:translate(-120px,-80px);}

}

.container{

    width:92%;
    max-width:470px;

    padding:35px;

    border-radius:35px;

    background:rgba(255,255,255,.65);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.8);

    box-shadow:
    0 25px 60px rgba(0,120,255,.12),
    inset 0 1px 0 rgba(255,255,255,.8);

    text-align:center;

    position:relative;

    z-index:1;

}

.label{

    color:#7d94a8;

    font-size:17px;

    letter-spacing:2px;

    margin-bottom:12px;

}

#now{

    font-size:42px;

    font-weight:700;

    color:#495a6c;

}

#result{

    margin:35px 0;

    font-size:86px;

    font-weight:800;

    color:#2196F3;

    text-shadow:0 10px 25px rgba(33,150,243,.25);

    transition:.25s;

    min-height:95px;

}

.buttons{

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:16px;

}

button{

    position:relative;

    overflow:hidden;

    border:none;

    border-radius:22px;

    padding:22px;

    font-size:24px;

    font-weight:700;

    color:#2196F3;

    background:white;

    box-shadow:

    0 10px 25px rgba(0,120,255,.10);

    transition:.18s;

    cursor:pointer;

}

button:hover{

    transform:translateY(-3px);

    box-shadow:0 18px 35px rgba(0,120,255,.15);

}

button:active{

    transform:scale(.95);

    background:#2196F3;

    color:white;

}

/* Ripple */

button span{

    position:absolute;

    border-radius:50%;

    transform:scale(0);

    background:rgba(255,255,255,.55);

    animation:ripple .55s linear;

}

@keyframes ripple{

to{

transform:scale(8);

opacity:0;

}

}

.footer{

    margin-top:25px;

    color:#7f96aa;

    font-size:14px;

}

</style>

</head>

<body>

<div class="container">

<div class="label">
現在時刻
</div>

<div id="now">
--:--:--
</div>

<div id="result">
--:--
</div>

<div class="buttons">

<button onclick="calc(event,45)">45分</button>

<button onclick="calc(event,60)">60分</button>

<button onclick="calc(event,75)">75分</button>

<button onclick="calc(event,90)">90分</button>

<button onclick="calc(event,120)">120分</button>

<button onclick="calc(event,180)">180分</button>

</div>

<div class="footer">
タップすると現在時刻から自動計算
</div>

</div>

<script>

function updateClock(){

    const now=new Date();

    const h=String(now.getHours()).padStart(2,"0");
    const m=String(now.getMinutes()).padStart(2,"0");
    const s=String(now.getSeconds()).padStart(2,"0");

    document.getElementById("now").innerHTML=`${h}:${m}:${s}`;

}

updateClock();

setInterval(updateClock,1000);

function calc(e,minutes){

    ripple(e);

    const now=new Date();

    now.setMinutes(now.getMinutes()+minutes);

    const h=String(now.getHours()).padStart(2,"0");
    const m=String(now.getMinutes()).padStart(2,"0");

    const result=document.getElementById("result");

    result.style.transform="scale(.8)";
    result.style.opacity="0";

    setTimeout(()=>{

        result.innerHTML=`${h}:${m}`;

        result.style.transform="scale(1)";

        result.style.opacity="1";

    },120);

}

function ripple(e){

    const button=e.currentTarget;

    const circle=document.createElement("span");

    const d=Math.max(button.clientWidth,button.clientHeight);

    circle.style.width=d+"px";
    circle.style.height=d+"px";

    const rect=button.getBoundingClientRect();

    circle.style.left=(e.clientX-rect.left-d/2)+"px";
    circle.style.top=(e.clientY-rect.top-d/2)+"px";

    button.appendChild(circle);

    setTimeout(()=>{

        circle.remove();

    },550);

}

</script>

</body>
</html>
