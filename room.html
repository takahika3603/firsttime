<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>room.html</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    sans-serif;

  background:#f3f6fb;
  overflow-y:auto;
}

.wrapper{
  position:relative;
  width:100vw;
  min-height:100vh;
  padding-bottom:40px;
}

/* ======================
HEADER
====================== */


/* ======================
LAYOUT
====================== */
.columns{
  margin-top:10px;
  
  width:100%;

  display:flex;
  justify-content:space-between;
  align-items:flex-start;

  padding:10px;
}

.side{
  width:43%;

  display:flex;
  flex-direction:column;
  gap:10px;
}

.side-title{
  text-align:center;
  font-weight:800;
  font-size:18px;
}

/* ======================
ROOM CARD
====================== */

.room{
  position:relative;

  background:#fff;

  border:2px solid #d9deea;
  border-radius:18px;

  padding:10px;

  min-height:82px;

  box-shadow:
    0 4px 14px rgba(0,0,0,.06);

  overflow:visible;
}

.room-number{
  font-size:10px;
  font-weight:800;
  min-width:38px;
}

.input{
  width:80%;
  height:20px;

  border:1px solid #ddd;
  border-radius:10px;

  padding:0 10px;

  font-size:14px;

  margin-top:6px;
}
.room-top{
  display:flex;
  align-items:center;
  gap:8px;
}

.name-input{
  flex:1;
}

.time-input{
  width:100%;
  margin-top:8px;
}

/* ======================
CONNECT DOT
====================== */

.connector{
  position:absolute;

  width:22px;
  height:22px;

  border-radius:50%;

  background:#4da3ff;

  border:4px solid #fff;

  box-shadow:
    0 2px 8px rgba(0,0,0,.2);

  z-index:10;

  touch-action:none;
}

.connector.left{
  left:-11px;
  top:50%;
  transform:translateY(-50%);
}

.connector.right{
  right:-11px;
  top:50%;
  transform:translateY(-50%);
}

/* ======================
SVG
====================== */

svg{
  position:fixed;
  inset:0;

  width:100%;
  height:100%;

  pointer-events:none;

  z-index:5;
}

.line{
  stroke:#4da3ff;
  stroke-width:4;
  fill:none;
}

.temp-line{
  stroke-dasharray:8 6;
}

.delete-circle{
  fill:#ff5a76;
  stroke:#fff;
  stroke-width:3;

  pointer-events:auto;
}

.delete-x{
  fill:#fff;
  font-size:14px;
  font-weight:bold;

  pointer-events:none;
}

.guide{
  position:fixed;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);

  background:#111;
  color:#fff;

  padding:8px 14px;

  border-radius:999px;

  font-size:12px;

  z-index:30;
}
</style>
</head>

<body>

<div class="wrapper">

  <svg id="svg"></svg>

  <div class="columns">

    <div class="side" id="morning">
      <div class="side-title">午前</div>
    </div>

    <div class="side" id="afternoon">
      <div class="side-title">午後</div>
    </div>

  </div>

  <div class="guide">
    青い点を長押しドラッグで接続
  </div>

</div>

<script>
const ROOM_LIST = [
  "201","202","203",
  "301","302","303",
  "401","402","501"
];

const morning = document.getElementById("morning");
const afternoon = document.getElementById("afternoon");
const svg = document.getElementById("svg");

function createTimeOptions(){

  let html = `<option value="">時間</option>`;

  for(let h = 12; h <= 23; h++){

    for(let m = 0; m < 60; m += 10){

      const hh =
        String(h).padStart(2,"0");

      const mm =
        String(m).padStart(2,"0");

      html += `
        <option value="${hh}:${mm}">
          ${hh}:${mm}
        </option>
      `;
    }
  }

  return html;
}
  
function createRoom(side,roomNo){

  const room = document.createElement("div");
  room.className = "room";
  room.dataset.side = side;
  room.dataset.room = roomNo;

  const connectorSide =
    side === "morning"
      ? "right"
      : "left";

room.innerHTML = `
  <div class="connector ${connectorSide}"></div>

  <div class="room-top">

    <div class="room-number">
      ${roomNo}
    </div>

    <input
      class="input name-input"
      placeholder="女の子の名前"
    >

  </div>

<select class="input time-input">
  ${createTimeOptions()}
</select>
`;

  return room;
}

ROOM_LIST.forEach(no=>{
  morning.appendChild(createRoom("morning",no));
  afternoon.appendChild(createRoom("afternoon",no));
});

/* ======================
UTIL
====================== */

function createSVG(tag){
  return document.createElementNS(
    "http://www.w3.org/2000/svg",
    tag
  );
}

function connectorCenter(el){

  const rect = el.getBoundingClientRect();

  return {
    x: rect.left + rect.width / 2,
    y: rect.top + rect.height / 2
  };
}

/* ======================
LINE SYSTEM
====================== */

let dragging = false;
let startConnector = null;
let tempLine = null;

const connections = [];

function startDrag(connector){

  dragging = true;

  startConnector = connector;

  const pos = connectorCenter(connector);

  tempLine = createSVG("line");

  tempLine.setAttribute("x1",pos.x);
  tempLine.setAttribute("y1",pos.y);

  tempLine.setAttribute("x2",pos.x);
  tempLine.setAttribute("y2",pos.y);

  tempLine.setAttribute("class","line temp-line");

  svg.appendChild(tempLine);
}

function moveDrag(x,y){

  if(!dragging || !tempLine) return;

  tempLine.setAttribute("x2",x);
  tempLine.setAttribute("y2",y);
}

function finishDrag(targetConnector){

  if(
    !targetConnector ||
    targetConnector === startConnector
  ){
    cleanup();
    return;
  }

  const startRoom =
    startConnector.closest(".room");

  const targetRoom =
    targetConnector.closest(".room");

  const side1 = startRoom.dataset.side;
  const side2 = targetRoom.dataset.side;

  if(side1 === side2){
    cleanup();
    return;
  }

  createConnection(
    startConnector,
    targetConnector
  );

  cleanup();
}

function cleanup(){

  dragging = false;

  if(tempLine){
    svg.removeChild(tempLine);
    tempLine = null;
  }

  startConnector = null;
}

function createConnection(from,to){

  const p1 = connectorCenter(from);
  const p2 = connectorCenter(to);

  const line = createSVG("line");

  line.setAttribute("x1",p1.x);
  line.setAttribute("y1",p1.y);

  line.setAttribute("x2",p2.x);
  line.setAttribute("y2",p2.y);

  line.setAttribute("class","line");

  svg.appendChild(line);

  /* 削除ボタン */

  const circle = createSVG("circle");

  circle.setAttribute("cx",p2.x);
  circle.setAttribute("cy",p2.y);

  circle.setAttribute("r",12);

  circle.setAttribute(
    "class",
    "delete-circle"
  );

  svg.appendChild(circle);

  const text = createSVG("text");

  text.setAttribute("x",p2.x);
  text.setAttribute("y",p2.y + 5);

  text.setAttribute(
    "text-anchor",
    "middle"
  );

  text.setAttribute(
    "class",
    "delete-x"
  );

  text.textContent = "×";

  svg.appendChild(text);

  const obj = {
    from,
    to,
    line,
    circle,
    text
  };

  connections.push(obj);

  circle.addEventListener("click",()=>{

    svg.removeChild(line);
    svg.removeChild(circle);
    svg.removeChild(text);

    const i = connections.indexOf(obj);

    if(i > -1){
      connections.splice(i,1);
    }
  });
}

/* ======================
CONNECT EVENTS
====================== */

document.querySelectorAll(".connector")
.forEach(connector=>{

  let holdTimer = null;

  connector.addEventListener(
    "pointerdown",
    e=>{

      e.preventDefault();

      holdTimer = setTimeout(()=>{

        startDrag(connector);

      },250);
    }
  );

  connector.addEventListener(
    "pointermove",
    e=>{

      if(!dragging) return;

      moveDrag(
        e.clientX,
        e.clientY
      );
    }
  );

  connector.addEventListener(
    "pointerup",
    e=>{

      clearTimeout(holdTimer);

      if(!dragging) return;

      const target =
        document.elementFromPoint(
          e.clientX,
          e.clientY
        );

      const targetConnector =
        target?.closest(".connector");

      finishDrag(targetConnector);
    }
  );

  connector.addEventListener(
    "pointercancel",
    ()=>{
      clearTimeout(holdTimer);
      cleanup();
    }
  );
});

/* ======================
GLOBAL MOVE
====================== */

window.addEventListener(
  "pointermove",
  e=>{
    if(!dragging) return;

    moveDrag(
      e.clientX,
      e.clientY
    );
  }
);

window.addEventListener(
  "pointerup",
  e=>{

    if(!dragging) return;

    const target =
      document.elementFromPoint(
        e.clientX,
        e.clientY
      );

    const targetConnector =
      target?.closest(".connector");

    finishDrag(targetConnector);
  }
);

/* ======================
RESIZE
====================== */

window.addEventListener(
  "resize",
  ()=>{

    connections.forEach(c=>{

      const p1 =
        connectorCenter(c.from);

      const p2 =
        connectorCenter(c.to);

      c.line.setAttribute("x1",p1.x);
      c.line.setAttribute("y1",p1.y);

      c.line.setAttribute("x2",p2.x);
      c.line.setAttribute("y2",p2.y);

      c.circle.setAttribute("cx",p2.x);
      c.circle.setAttribute("cy",p2.y);

      c.text.setAttribute("x",p2.x);
      c.text.setAttribute("y",p2.y + 5);
    });
  }
);
</script>

</body>
</html>
