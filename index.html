<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ルーム管理システム</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

body{
  background:#0f172a;
  color:#fff;
  overflow:hidden;
}

.wrapper{
  display:flex;
  height:100vh;
}

/* =====================
エレベーター
===================== */
.elevator-side{
  width:90px;
  background:#111827;
  border-right:1px solid rgba(255,255,255,0.1);
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
}

.elevator-line{
  width:6px;
  height:78%;
  background:rgba(255,255,255,0.15);
  border-radius:999px;
  position:relative;
}

.floor-dot{
  position:absolute;
  left:50%;
  transform:translate(-50%,-50%);
  width:16px;
  height:16px;
  border-radius:50%;
  background:rgba(255,255,255,0.5);
  border:1px solid rgba(255,255,255,0.3);
  transition:0.25s;
  cursor:pointer;
}

.floor-dot.active{
  width:30px;
  height:30px;
  background:#34d399;
  box-shadow:0 0 20px rgba(52,211,153,0.9);
}

.floor-label{
  position:absolute;
  left:-35px;
  color:#d1d5db;
  font-size:12px;
  transform:translateY(-50%);
}

.current-floor{
  position:absolute;
  bottom:20px;
  text-align:center;
}

.current-floor small{
  color:#94a3b8;
  font-size:11px;
}

.current-floor h2{
  color:#6ee7b7;
  font-size:28px;
}

/* =====================
メイン
===================== */
.main{
  flex:1;
  padding:14px;
  overflow:auto;
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.title h1{
  font-size:30px;
  font-weight:900;
}

.title p{
  color:#94a3b8;
  margin-top:4px;
  font-size:13px;
}

.summary{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  padding:12px 18px;
  border-radius:18px;
}

.summary small{
  color:#94a3b8;
}

.summary h2{
  font-size:28px;
}

/* =====================
ルーム
===================== */
.room-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}

.room-card{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:14px;
  padding:5px;
  backdrop-filter:blur(10px);
}
.room-card.half{
  grid-column:span 1;
}
.room-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:5px;
}

.room-number{
  font-size:18px;
  font-weight:900;
  color:#7dd3fc;
}

.status{
  padding:3px 7px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}

.status.busy{
  background:#ec4899;
}

.status.wait{
  background:#38bdf8;
}

.status.clean{
  background:#f59e0b;
}

.status.move{
  background:#a855f7;
}
.status-select{
  padding:4px 8px;
  border-radius:999px;
  border:none;
  font-size:12px;
  font-weight:700;
  color:#fff;
  outline:none;
  cursor:pointer;
}

.status-select.busy{
  background:#ec4899;
}

.status-select.wait{
  background:#38bdf8;
}

.status-select.clean{
  background:#f59e0b;
}

.status-select.move{
  background:#a855f7;
}
.label{
  font-size:11px;
  color:#94a3b8;
  margin-bottom:6px;
}

.input{
  width:100%;
  background:#1e293b;
  border:1px solid rgba(255,255,255,0.08);
  border-radius:9px;
  padding:5px;
  color:#fff;
  outline:none;
  font-size:11px;
  margin-bottom:4px;
}

.bottom-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stats{
  margin-top:14px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.stat-box{
  border-radius:20px;
  padding:14px;
}

.stat-box h3{
  font-size:13px;
  margin-bottom:6px;
}

.stat-box strong{
  font-size:34px;
}

.green{
  background:rgba(16,185,129,0.12);
  border:1px solid rgba(16,185,129,0.25);
}

.blue{
  background:rgba(56,189,248,0.12);
  border:1px solid rgba(56,189,248,0.25);
}

.orange{
  background:rgba(245,158,11,0.12);
  border:1px solid rgba(245,158,11,0.25);
}

@media(max-width:900px){
  .room-grid{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>
<body>

<div class="wrapper">

  <!-- エレベーター -->
  <div class="elevator-side">

    <div class="elevator-line">

      <div class="floor-label" style="top:0%;">5F</div>
      <div class="floor-dot" style="top:0%;"></div>

      <div class="floor-label" style="top:23%;">4F</div>
      <div class="floor-dot" style="top:23%;"></div>

      <div class="floor-label" style="top:46%;">3F</div>
      <div class="floor-dot active" style="top:46%;"></div>

      <div class="floor-label" style="top:69%;">2F</div>
      <div class="floor-dot" style="top:69%;"></div>

      <div class="floor-label" style="top:92%;">1F</div>
      <div class="floor-dot" style="top:92%;"></div>

    </div>

    <div class="current-floor">
      <small>現在位置</small>
      <h2 id="floorText">3F</h2>
    </div>
  </div>


  <!-- メイン -->
  <div class="main">




    <div class="room-grid" id="roomGrid"></div>


    <div class="stats">
      <div class="stat-box green">
        <h3>接客中</h3>
        <strong>3</strong>
      </div>

      <div class="stat-box blue">
        <h3>待機</h3>
        <strong>3</strong>
      </div>

      <div class="stat-box orange">
        <h3>清掃・移動</h3>
        <strong>3</strong>
      </div>
    </div>

  </div>
</div>

<script>
// =========================
// 保存キー
// =========================
const STORAGE_KEY_FLOOR = 'elevatorCurrentFloor';

// =========================
// ルームデータ
// =========================
const defaultRooms = [
  {room:'201',name:'ひめか',end:'00:40',status:'busy'},
  {room:'202',name:'みれい',end:'01:00',status:'wait'},
  {room:'203',name:'あや',end:'01:15',status:'clean'},
  {room:'301',name:'るな',end:'00:55',status:'busy'},
  {room:'302',name:'ここな',end:'01:20',status:'move'},
  {room:'303',name:'のあ',end:'01:40',status:'wait'},
  {room:'401',name:'えま',end:'00:50',status:'busy'},
  {room:'402',name:'ゆい',end:'01:10',status:'clean'},
  {room:'501',name:'さら',end:'01:50',status:'wait'},
];

const STORAGE_KEY_ROOMS = 'roomData';

const rooms =
  JSON.parse(localStorage.getItem(STORAGE_KEY_ROOMS))
  || defaultRooms;

const statusText = {
  busy:'接客中',
  wait:'待機',
  clean:'清掃中',
  move:'移動中'
};

const grid = document.getElementById('roomGrid');

rooms.forEach(room=>{

  const cardClass = room.room === '201'
    ? 'room-card half-card'
    : 'room-card';

  grid.innerHTML += `
  <div class="${cardClass}">

    <div class="room-top">
      <div class="room-number">${room.room}</div>

      <select
  class="status-select ${room.status}"
  data-room="${room.room}">
        <option value="busy" ${room.status==='busy'?'selected':''}>接客中</option>
        <option value="wait" ${room.status==='wait'?'selected':''}>待機</option>
        <option value="move" ${room.status==='move'?'selected':''}>移動中</option>
        <option value="clean" ${room.status==='clean'?'selected':''}>清掃中</option>
      </select>
    </div>

<div>
<input
  type="time"
  class="input time-input end-input"
  data-room="${room.room}"
  value="${room.end}">
</div>

    <div style="margin-top:6px;">
      <input
  class="input name-input"
  data-room="${room.room}"
  value="${room.name}">
    </div>

  </div>
  `;
});

// =========================
// エレベーター位置保存機能
// =========================
const dots = document.querySelectorAll('.floor-dot');
const floorText = document.getElementById('floorText');

const floors = ['5F','4F','3F','2F','1F'];

// 階数表示更新関数
function setFloor(index){

  dots.forEach(d=>d.classList.remove('active'));

  dots[index].classList.add('active');

  floorText.innerText = floors[index];

  // 保存
  localStorage.setItem(STORAGE_KEY_FLOOR,index);
}

// 保存済み階数を読み込み
const savedFloor = localStorage.getItem(STORAGE_KEY_FLOOR);

// 保存があれば反映
if(savedFloor !== null){
  setFloor(Number(savedFloor));
}

// クリック時
dots.forEach((dot,index)=>{

  dot.addEventListener('click',()=>{

    setFloor(index);

  });

});

// =========================
// ステータス色変更
// =========================
document.querySelectorAll('.status-select').forEach(select=>{

  const updateColor = ()=>{

    select.classList.remove('busy','wait','clean','move');

    select.classList.add(select.value);

  };

  updateColor();

  select.addEventListener('change',updateColor);

});
// =========================
// データ保存
// =========================
function saveRooms(){

  localStorage.setItem(
    STORAGE_KEY_ROOMS,
    JSON.stringify(rooms)
  );

}

// 時間保存
document.querySelectorAll('.end-input').forEach(input=>{

  input.addEventListener('change',()=>{

    const room = rooms.find(
      r => r.room === input.dataset.room
    );

    room.end = input.value;

    saveRooms();

  });

});

// 名前保存
document.querySelectorAll('.name-input').forEach(input=>{

  input.addEventListener('input',()=>{

    const room = rooms.find(
      r => r.room === input.dataset.room
    );

    room.name = input.value;

    saveRooms();

  });

});

// ステータス保存
document.querySelectorAll('.status-select').forEach(select=>{

  select.addEventListener('change',()=>{

    const room = rooms.find(
      r => r.room === select.dataset.room
    );

    room.status = select.value;

    saveRooms();

  });

});
</script>

</body>
</html>
