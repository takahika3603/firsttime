<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>散歩系雑談マスター</title>
<style>
*{
    box-sizing:border-box;
}
body{
    margin:0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        sans-serif;
    background:#f4f8fb;
    color:#263238;
}
/* =========================
   HEADER
========================= */
header{
    background:linear-gradient(135deg,#82c9e8,#b9e4f5);
    color:white;
    padding:18px 20px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}
.header-inner{
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}
.logo{
    font-size:21px;
    font-weight:800;
}
.subtitle{
    font-size:12px;
    opacity:.9;
    margin-top:3px;
}
.header-buttons{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}
.header-btn{
    background:white;
    color:#4295b8;
    border-radius:20px;
    padding:8px 13px;
    font-weight:bold;
}
/* =========================
   CONTAINER
========================= */
.container{
    max-width:1100px;
    margin:0 auto;
    padding:20px;
}
/* =========================
   DASHBOARD
========================= */
.dashboard{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:20px;
}
.stat{
    background:white;
    border-radius:15px;
    padding:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
}
.stat-label{
    font-size:12px;
    color:#78909c;
}
.stat-number{
    font-size:27px;
    font-weight:800;
    color:#42a5c8;
    margin-top:4px;
}
/* =========================
   ADD AREA
========================= */
.add-area{
    background:white;
    border-radius:18px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
}
.add-area h2{
    margin:0 0 12px;
    font-size:17px;
}
.input-row{
    display:flex;
    gap:9px;
}
input,textarea,select{
    width:100%;
    border:1px solid #d8e5ea;
    border-radius:10px;
    padding:11px 12px;
    font-size:14px;
    outline:none;
    font-family:inherit;
}
input:focus,
textarea:focus,
select:focus{
    border-color:#76c3df;
    box-shadow:0 0 0 3px rgba(118,195,223,.15);
}
.add-main{
    background:#59b6d7;
    color:white;
    border-radius:10px;
    padding:0 18px;
    font-weight:bold;
    white-space:nowrap;
}
/* =========================
   TOOLBAR
========================= */
.toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
}
.search{
    flex:1;
}
.search input{
    background:white;
}
.toolbar-buttons{
    display:flex;
    gap:6px;
}
.tool-btn{
    background:white;
    border:1px solid #dce8ec;
    color:#55808e;
    border-radius:9px;
    padding:9px 12px;
    font-size:12px;
    font-weight:bold;
}
/* =========================
   TOPICS
========================= */
.topic-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}
.topic-card{
    background:white;
    border-radius:17px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
    overflow:hidden;
}
.topic-header{
    display:flex;
    align-items:center;
    gap:9px;
    padding:14px;
}
.topic-main{
    flex:1;
    min-width:0;
}
.topic-title{
    font-weight:800;
    font-size:16px;
    word-break:break-word;
}
.topic-note{
    color:#78909c;
    font-size:13px;
    margin-top:5px;
    white-space:pre-wrap;
}
.category{
    display:inline-block;
    background:#e7f6fb;
    color:#3294b8;
    border-radius:20px;
    padding:4px 9px;
    font-size:11px;
    margin-bottom:5px;
}
