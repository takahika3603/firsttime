<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>業務チェックリスト</title>

<style>

*{
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
margin:0;
background:#eef8ff;
padding:15px;
}

h1{
text-align:center;
color:#009cff;
font-size:22px;
}

.staffs{
display:flex;
overflow-x:auto;
gap:10px;
margin-bottom:15px;
}

.staff{
min-width:110px;
background:white;
padding:10px;
border-radius:15px;
text-align:center;
box-shadow:0 4px 15px #ccc;
}

.staff.active{
border:2px solid #00aaff;
}

input{
width:100%;
border:none;
text-align:center;
font-size:12px;
}

.percent{
font-size:12px;
color:#009cff;
margin-top:5px;
}


.box{
background:white;
border-radius:20px;
padding:15px;
}


.task{
display:flex;
align-items:center;
padding:9px;
margin:6px 0;
background:#f5fbff;
border-radius:12px;
font-size:12px;
}

.task.done{
background:#cfffff;
}

.check{
width:20px;
height:20px;
border-radius:50%;
border:2px solid #00aaff;
margin-right:10px;
text-align:center;
font-size:12px;
}

.done .check{
background:#00aaff;
color:white;
}


button{
width:100%;
margin-top:15px;
padding:12px;
border:none;
border-radius:15px;
background:#00aaff;
color:white;
font-weight:bold;
}

</style>

</head>


<body>


<h1>業務チェックリスト</h1>


<div class="staffs" id="staffs"></div>


<div class="box">

<h3 id="name"></h3>

<div id="tasks"></div>


<button onclick="resetUser()">
この人をリセット
</button>

</div>



<script>


const taskList=[

"1つめチェック",
"確認電話チェック",
"パネルを取る",
"台帳埋める",
"即ヒメ更新",
"エニークラウド入力",
"予約伝達",
"右クリックチェック",
"紙記載",
"タイマー設置",
"案内",
"右クリックチェック",
"即ヒメ更新",
"台帳更新",
"時間軸更新",
"10分前コール",
"待機中更新",
"パネル設置",
"次予約確認",
"アウトコール＆次予約伝達",
"時間軸更新"

];
// 予約対応専用

const reserveTasks=[

"エニークラウド入力",
"ポイント利用確認",
"オプション確認",
"金額相違確認",
"ポイント処理（ある場合）",
"チャット送信or電話",
"即ヒメ更新"

];

let names=
JSON.parse(localStorage.getItem("names"))
||
[
"スタッフ1",
"スタッフ2",
"スタッフ3",
"スタッフ4",
"スタッフ5",
"スタッフ6",
"スタッフ7",
"予約対応"
];


let data=
JSON.parse(localStorage.getItem("data"))
||
Array.from({length:8},()=>Array(21).fill(false));


if(data.length<8){
data.push(Array(21).fill(false));
}


let current=0;



function save(){

localStorage.setItem("names",JSON.stringify(names));
localStorage.setItem("data",JSON.stringify(data));

}



function renderStaff(){

let box=document.getElementById("staffs");

box.innerHTML="";


names.forEach((n,i)=>{


let count=data[i].filter(x=>x).length;

let total=i===7 ? 7 : 21;

let per=Math.floor(count/total*100);


let div=document.createElement("div");

div.className="staff "+(i==current?"active":"");


div.innerHTML=

`
<input value="${n}">
<div class="percent">${per}%</div>
`;


div.querySelector("input").onchange=e=>{

names[i]=e.target.value;
save();

};


div.onclick=()=>{

current=i;
render();

};


box.appendChild(div);


});


}



function renderTasks(){

let box=document.getElementById("tasks");

box.innerHTML="";


let nowTasks = current===7 ? reserveTasks : taskList;


nowTasks.forEach((t,i)=>{


let div=document.createElement("div");

div.className="task";


if(data[current][i])
div.classList.add("done");


div.innerHTML=

`
<div class="check">
${data[current][i]?"✓":""}
</div>

${t}
`;


div.onclick=()=>{

data[current][i]=!data[current][i];

save();

render();

};


box.appendChild(div);


});


}



function resetUser(){

if(confirm("リセットしますか？")){

data[current]=Array(21).fill(false);

save();

render();

}

}



function render(){

document.getElementById("name").innerText=
names[current];


renderStaff();

renderTasks();

}


render();


</script>


</body>
</html>
