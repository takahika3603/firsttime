<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ルーム管理システム</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

body{
  background:#f8fafc;
  color:#111827;
  overflow:hidden;
}

.wrapper{
  display:flex;
  height:100vh;
}

/* =====================
メイン
===================== */
.main{
  flex:1;
  padding:14px;
  overflow:auto;
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.title h1{
  font-size:30px;
  font-weight:900;
}

.title p{
  color:#94a3b8;
  margin-top:4px;
  font-size:13px;
}

.summary{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  padding:12px 18px;
  border-radius:18px;
}

.summary small{
  color:#94a3b8;
}

.summary h2{
  font-size:28px;
}

/* =====================
ルーム
===================== */
.room-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}

.room-card{
  background:#ffffff;
  border:1px solid #7dd3fc;
  border-radius:14px;
  padding:5px;
  box-shadow:none;
}
.room-card.half{
  grid-column:span 1;
}
.room-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:5px;
}

.room-number{
  font-size:18px;
  font-weight:900;
  color:#7dd3fc;
}

.status{
  padding:3px 7px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}

.status.busy{
  background:#ec4899;
}

.status.wait{
  background:#38bdf8;
}

.status.clean{
  background:#f59e0b;
}

.status.move{
  background:#a855f7;
}
.status-select{
  padding:4px 8px;
  border-radius:999px;
  border:none;
  font-size:12px;
  font-weight:700;
  color:#fff;
  outline:none;
  cursor:pointer;
}

.status-select.busy{
  background:#ec4899;
}

.status-select.wait{
  background:#38bdf8;
}

.status-select.clean{
  background:#f59e0b;
}

.status-select.move3{
  background:#a855f7;
}

.status-select.move5{
  background:#a855f7;
}
/* 追加 */
.status-select.empty{
  background:#10b981;
}
.status-select.prep{
  background:#64748b;
}
 .status-select.guide{
  background:#22c55e;
}

.status-select.leave{
  background:#ef4444;
} 
.status-select.setwait{
  background:#06b6d4;
}

.status-select.setting{
  background:#14b8a6;
}
.status-select.downwait{
  background:#f97316;
}  
.status-select.prepcall{
  background:#eab308;
}
  
.label{
  font-size:11px;
  color:#94a3b8;
  margin-bottom:6px;
}

.input{
  width:90%;
  background:#f8fafc;
  border:1px solid #cbd5e1;
  border-radius:9px;
  padding:5px;
  color:#111827;
  outline:none;
  font-size:11px;
  margin-bottom:4px;
}

.input:focus{
  border-color:#38bdf8;
}

.bottom-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}


@media(max-width:900px){
  .room-grid{
    grid-template-columns:repeat(2,1fr);
  }
}
/* =====================
部屋繋ぎボタン
===================== */
.room-link-btn{
  position:fixed;
  right:18px;
  bottom:18px;

  background:#0ea5e9;
  color:#fff;
  text-decoration:none;

  padding:12px 18px;
  border-radius:999px;

  font-size:13px;
  font-weight:700;

  box-shadow:
    0 10px 25px rgba(14,165,233,0.35);

  transition:0.25s;

  opacity:0.35;
  transform:translateY(0);
}

.room-link-btn:hover{
  opacity:1;
  transform:translateY(-3px) scale(1.04);

  background:#38bdf8;

  box-shadow:
    0 15px 35px rgba(56,189,248,0.55);
}
</style>
</head>
<body>

<div class="wrapper">



  <!-- メイン -->
  <div class="main">




    <div class="room-grid" id="roomGrid"></div>


  </div>
</div>

<script>


// =========================
// ルームデータ
// =========================
const defaultRooms = [
  {room:'201',name:'ひめか',end:'00:40',status:'busy'},
  {room:'202',name:'みれい',end:'01:00',status:'wait'},
  {room:'203',name:'あや',end:'01:15',status:'clean'},
  {room:'301',name:'るな',end:'00:55',status:'busy'},
  {room:'302',name:'ここな',end:'01:20',status:'move3'},
  {room:'303',name:'のあ',end:'01:40',status:'wait'},
  {room:'401',name:'えま',end:'00:50',status:'busy'},
  {room:'402',name:'ゆい',end:'01:10',status:'clean'},
  {room:'501',name:'さら',end:'01:50',status:'wait'},
];

const STORAGE_KEY_ROOMS = 'roomData';

const rooms =
  JSON.parse(localStorage.getItem(STORAGE_KEY_ROOMS))
  || defaultRooms;

const statusText = {
  empty:'空き',
  wait:'待機',
  prepcall:'準備コール',
  prep:'準備中',
  guide:'案内待ち',
  busy:'接客中',
  move3:'移動中（3F）',
  move5:'移動中（5F）',
  leave:'お帰り待ち',
  clean:'片付中',
  setwait:'セット待ち',
  setting:'セット中',
  downwait:'降り待ち',
};

const grid = document.getElementById('roomGrid');

rooms.forEach(room=>{

  const cardClass = room.room === '201'
    ? 'room-card half-card'
    : 'room-card';

  grid.innerHTML += `
  <div class="${cardClass}">

    <div class="room-top">
      <div class="room-number">${room.room}</div>

      <select
  class="status-select ${room.status}"
  data-room="${room.room}">
        <option value="empty" ${room.status==='empty'?'selected':''}>空き</option>
        <option value="wait" ${room.status==='wait'?'selected':''}>待機</option>
        <option value="prepcall" ${room.status==='prepcall'?'selected':''}>準備コール</option>
        <option value="prep" ${room.status==='prep'?'selected':''}>準備中</option>
        <option value="guide" ${room.status==='guide'?'selected':''}>案内待ち</option>
        <option value="busy" ${room.status==='busy'?'selected':''}>接客中</option>
        <option value="move3" ${room.status==='move3'?'selected':''}>移動中（3F）</option>
        <option value="move5" ${room.status==='move5'?'selected':''}>移動中（5F）</option>
        <option value="leave" ${room.status==='leave'?'selected':''}>お帰り待ち</option>
        <option value="clean" ${room.status==='clean'?'selected':''}>片付中</option>
        <option value="setwait" ${room.status==='setwait'?'selected':''}>セット待ち</option>
        <option value="setting" ${room.status==='setting'?'selected':''}>セット中</option>
        <option value="downwait" ${room.status==='downwait'?'selected':''}>降り待ち</option>

      </select>
    </div>

<div>
<input
  type="time"
  class="input time-input end-input"
  data-room="${room.room}"
  value="${room.end}">
</div>

    <div style="margin-top:6px;">
      <input
  class="input name-input"
  data-room="${room.room}"
  value="${room.name}">
    </div>

  </div>
  `;
});


// =========================
// ステータス色変更
// =========================
document.querySelectorAll('.status-select').forEach(select=>{

  const updateColor = ()=>{

    select.classList.remove(
  'busy',
  'wait',
  'prepcall',
  'guide',
  'leave',
  'clean',
  'move3',
  'move5',
  'empty',
  'prep',
  'setwait',
  'setting',
  'downwait'
);
    select.classList.add(select.value);

  };

  updateColor();

  select.addEventListener('change',updateColor);

});
// =========================
// データ保存
// =========================
function saveRooms(){

  localStorage.setItem(
    STORAGE_KEY_ROOMS,
    JSON.stringify(rooms)
  );

}

// 時間保存
document.querySelectorAll('.end-input').forEach(input=>{

  input.addEventListener('change',()=>{

    const room = rooms.find(
      r => r.room === input.dataset.room
    );

    room.end = input.value;

    saveRooms();

  });

});

// 名前保存
document.querySelectorAll('.name-input').forEach(input=>{

  input.addEventListener('input',()=>{

    const room = rooms.find(
      r => r.room === input.dataset.room
    );

    room.name = input.value;

    saveRooms();

  });

});

// ステータス保存
document.querySelectorAll('.status-select').forEach(select=>{

  select.addEventListener('change',()=>{

    const room = rooms.find(
      r => r.room === select.dataset.room
    );

    room.status = select.value;

    saveRooms();

  });

});
</script>
<!-- 部屋繋ぎボタン -->
<a href="room.html" class="room-link-btn">
  部屋繋ぎ
</a>
</body>
</html>
